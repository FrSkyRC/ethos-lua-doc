site_name: Ethos Lua Docs
site_description: Lua API reference, guides, best practice and examples for FrSky Ethos radios
site_url: https://frskyrc.github.io/ethos-lua-doc/
repo_url: https://github.com/FrSkyRC/ethos-lua-doc
repo_name: ethos-lua-doc
edit_uri: edit/main/docs/
docs_dir: docs
# nav files are read by literate-nav but shouldn't be published as pages
exclude_docs: |
  SUMMARY.md

hooks:
  # Generated API pages carry `overlay:` front matter; this points their
  # "edit" button at the overlay file instead of the generated Markdown.
  - hooks/overlay_edit_url.py
  # Writes site/llms.txt (https://llmstxt.org) from the nav, for AI agents.
  - hooks/llms_txt.py

theme:
  name: material
  logo: assets/ethos-logo-reversed.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  # Nav comes from docs/SUMMARY.md (hand-written) and docs/api/SUMMARY.md
  # (generated by scripts/gen_api_pages.py).
  - literate-nav:
      nav_file: SUMMARY.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FrSkyRC/ethos-lua-doc

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
      # glossary tooltips (closure, upvalue, hot path, ...) on every page
      auto_append: ["includes/abbreviations.md"]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
