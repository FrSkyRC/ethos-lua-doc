name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Generated pages are committed, but regenerate from data/*.json so a
      # hand-edit of docs/api/ (or a stale generator) can't slip through.
      - name: Regenerate API pages from committed data
        run: python scripts/gen_api_pages.py

      - name: Generated pages are up to date
        run: git diff --exit-code -- docs/api || (echo "::error::docs/api is out of date - run scripts/gen_api_pages.py and commit" && exit 1)

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
