name: Update lua-doc

# Pulls the newest lua-doc.zip (location changes with every Ethos release,
# discovered via the GitHub releases API - see AGENTS.md), FrSky's official
# examples and real-world usage, regenerates the site content and opens a PR
# when anything changed.

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: "lua-doc channel"
        type: choice
        options: [nightly, stable, pinned]
        default: nightly

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch upstream and regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # avoids API rate limits for release discovery
        run: python scripts/update.py --channel "${{ inputs.channel || 'nightly' }}"

      - name: Build check
        run: mkdocs build --strict

      - name: Summarise API changes
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo "Automated refresh of upstream sources."
            echo
            echo "- lua-doc: \`$(python -c "import json;s=json.load(open('data/api.json'))['source'];print(s['release'], s['sha256'][:12])")\`"
            echo
            echo '```'
            git diff --stat -- data docs/api docs/examples | tail -n 25
            echo '```'
            echo
            echo "Review checklist: see AGENTS.md → Reviewing an update."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-lua-doc
          commit-message: "Update lua-doc, official examples and real-world usage"
          title: "Update lua-doc and examples"
          body: ${{ steps.summary.outputs.body }}
          labels: automated
          delete-branch: true
